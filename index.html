<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Document</title>
</head>
<body>
    <div class="calculator">
        <input type="text" class="display">
        <div class="buttons">
            <button class="clear">C</button>
            <button class="delete"><i class="fa-solid fa-delete-left"></i></button>
            <button class="percentage">%</button>
            <button class="divide">/</button>
            <button class="7">7</button>
            <button class="8">8</button>
            <button class="9">9</button>
            <button class="multiply">*</button>
            <button class="4">4</button>
            <button class="5">5</button>
            <button class="6">6</button>
            <button class="subtract">-</button>
            <button class="1">1</button>
            <button class="2">2</button>
            <button class="3">3</button>
            <button class="+">+</button>
            <button class="bracket">()</button>
            <button class="0">0</button>
            <button class="point">.</button>
            <button class="equalto">=</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
